name: Build extension packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match manifest version v$version."
            exit 1
          fi

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Prepare browser packages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mailcode-chrome" "$RUNNER_TEMP/mailcode-firefox" dist
          for file in manifest.json background.js content.js gmail-service.js popup.html popup.css popup.js icon.png; do
            cp "$file" "$RUNNER_TEMP/mailcode-chrome/$file"
            cp "$file" "$RUNNER_TEMP/mailcode-firefox/$file"
          done

          node - "$RUNNER_TEMP/mailcode-firefox/manifest.json" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.background = { scripts: ['gmail-service.js', 'background.js'] };
          manifest.browser_specific_settings = {
            gecko: { id: 'mailcode@local' }
          };
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          (
            cd "$RUNNER_TEMP/mailcode-firefox"
            zip -qr "$GITHUB_WORKSPACE/dist/mailCode-firefox-unsigned.xpi" .
          )

      - name: Build signed Chrome CRX
        shell: bash
        env:
          CHROME_EXTENSION_KEY: ${{ secrets.CHROME_EXTENSION_KEY }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          if [[ -z "$CHROME_EXTENSION_KEY" ]]; then
            echo "::error::Add the persistent PEM private key as the CHROME_EXTENSION_KEY repository secret."
            exit 1
          fi

          printf '%s\n' "$CHROME_EXTENSION_KEY" > "$RUNNER_TEMP/mailcode-extension.pem"
          "$CHROME_PATH" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --pack-extension="$RUNNER_TEMP/mailcode-chrome" \
            --pack-extension-key="$RUNNER_TEMP/mailcode-extension.pem"
          test -s "$RUNNER_TEMP/mailcode-chrome.crx"
          cp "$RUNNER_TEMP/mailcode-chrome.crx" dist/mailCode-chrome.crx

      - name: Verify package files
        shell: bash
        run: |
          test -s dist/mailCode-chrome.crx
          test -s dist/mailCode-firefox-unsigned.xpi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mailCode-browser-packages
          path: |
            dist/mailCode-chrome.crx
            dist/mailCode-firefox-unsigned.xpi
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mailCode-chrome.crx
            dist/mailCode-firefox-unsigned.xpi
